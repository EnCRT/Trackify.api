# =============================================================================
# Trackify.API — CI/CD Pipeline
#
# Triggers:
#   pull_request    → build check (validate Dockerfile + Strapi build)
#   push to main    → Render auto-deploys via native GitHub integration
#
# Deployment:
#   Render Free Tier auto-deploys on every push to the connected branch.
#   No GitHub Actions deployment step needed — Render handles it natively.
#   Configured via render.yaml in the repo root.
#
#   Manual deploy trigger (optional): `curl -X POST $RENDER_DEPLOY_HOOK`
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ---- Build Check (validates Docker image builds correctly) ----
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi
        run: npm run build

      - name: Validate Docker build
        run: docker build -t trackify-api:${{ github.sha }} .

  # ---- Lint (if eslint is configured) ----
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: false  # Enable when eslint is set up
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
