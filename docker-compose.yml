version: '3.8'

# =============================================================================
# Trackify.API — Local Development Stack
#
# Usage:
#   docker compose up -d          # Start PostgreSQL + Strapi
#   docker compose up -d postgres # Start only PostgreSQL (dev with `npm run dev`)
#   docker compose down -v        # Tear down + remove volumes
# =============================================================================

services:
  # ---- PostgreSQL 16 + PostGIS ----
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: trackify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-trackify}
      POSTGRES_USER: ${DATABASE_USERNAME:-trackify}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-trackify_dev}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-trackify} -d ${DATABASE_NAME:-trackify}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Strapi 5 Application ----
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackify-strapi
    restart: unless-stopped
    ports:
      - "${PORT:-1337}:1337"
    environment:
      # Server
      HOST: 0.0.0.0
      PORT: ${PORT:-1337}
      # Secrets (REQUIRED — use `openssl rand -base64 32` to generate)
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Database
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-trackify}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-trackify}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-trackify_dev}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
